<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijkstra Puno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* ── MAPA A PANTALLA COMPLETA ── */
        #map {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        /* ── TARJETA FLOTANTE ── */
        .card {
            position: fixed;
            top: 18px; left: 18px;
            width: 340px;
            background: #fff;
            border-radius: 20px;
            box-shadow:
                0 2px 6px rgba(0,0,0,0.08),
                0 12px 40px rgba(0,0,0,0.16),
                0 0 0 1px rgba(0,0,0,0.04);
            overflow: hidden;
            z-index: 200;
        }

        /* ── CABECERA DE LA TARJETA ── */
        .card-head {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #1d4ed8 100%);
            padding: 18px 20px 16px;
            display: flex;
            align-items: center;
            gap: 13px;
        }
        .head-icon {
            width: 42px; height: 42px; flex-shrink: 0;
            background: rgba(255,255,255,0.12);
            border: 1.5px solid rgba(255,255,255,0.2);
            border-radius: 13px;
            display: flex; align-items: center; justify-content: center;
        }
        .head-icon svg { fill: white; width: 20px; height: 20px; }
        .head-title {
            font-size: 16px; font-weight: 800;
            color: #fff; letter-spacing: -.4px;
        }
        .head-sub {
            font-size: 11px; font-weight: 500;
            color: rgba(255,255,255,.55);
            margin-top: 2px;
        }

        /* ── CUERPO DEL FORMULARIO ── */
        .card-body { padding: 18px 18px 14px; }

        .field-wrap { margin-bottom: 11px; }
        .field-lbl {
            display: flex; align-items: center; gap: 7px;
            font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .7px;
            color: #94a3b8; margin-bottom: 6px;
        }
        .marker-dot {
            width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
            border: 2px solid;
        }

        .select-wrap { position: relative; }
        .select-wrap select {
            width: 100%;
            padding: 10px 36px 10px 13px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit; font-size: 13px; font-weight: 600;
            color: #0f172a;
            appearance: none; cursor: pointer;
            transition: border-color .2s, box-shadow .2s;
        }
        .select-wrap select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.1);
        }
        .select-wrap select:hover { border-color: #cbd5e1; }
        .select-caret {
            position: absolute; right: 12px; top: 50%;
            transform: translateY(-50%);
            pointer-events: none; color: #94a3b8;
        }

        .swap-row {
            display: flex; align-items: center; gap: 8px;
            margin: 4px 0 9px;
        }
        .swap-line { flex: 1; height: 1px; background: #f1f5f9; }
        .swap-btn {
            width: 28px; height: 28px; border-radius: 50%;
            background: #f8fafc; border: 1.5px solid #e2e8f0;
            color: #64748b; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; flex-shrink: 0;
            transition: all .25s;
        }
        .swap-btn:hover {
            background: #eff6ff; border-color: #2563eb;
            color: #2563eb; transform: rotate(180deg);
        }

        .btn-calc {
            width: 100%; padding: 12px;
            background: #2563eb;
            color: #fff; font-family: inherit;
            font-size: 13.5px; font-weight: 700;
            border: none; border-radius: 13px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all .2s;
            box-shadow: 0 4px 14px rgba(37,99,235,.35);
        }
        .btn-calc:hover {
            background: #1d4ed8;
            box-shadow: 0 6px 20px rgba(37,99,235,.5);
            transform: translateY(-1px);
        }
        .btn-calc:active { transform: scale(.98); }

        /* ── ESTADO CARGANDO ── */
        .state-load {
            display: none; align-items: center; gap: 10px;
            padding: 11px 18px;
            background: #eff6ff; border-top: 1px solid #dbeafe;
            font-size: 12.5px; font-weight: 600; color: #1d4ed8;
        }
        .state-load.on { display: flex; }
        .spinner {
            width: 16px; height: 16px; flex-shrink: 0;
            border: 2.5px solid #bfdbfe;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── ESTADO ERROR ── */
        .state-err {
            display: none;
            padding: 11px 18px;
            background: #fef2f2; border-top: 1px solid #fecaca;
            font-size: 12px; color: #dc2626; font-weight: 500;
        }
        .state-err.on { display: block; }

        /* ── PANEL DE RESULTADOS ── */
        .res-panel {
            display: none;
            border-top: 1px solid #f1f5f9;
            animation: slideDown .3s ease-out;
        }
        .res-panel.on { display: block; }
        @keyframes slideDown {
            from { opacity:0; transform: translateY(-8px); }
            to   { opacity:1; transform: translateY(0); }
        }

        .stats-row {
            display: grid; grid-template-columns: 1fr 1fr;
            border-bottom: 1px solid #f1f5f9;
        }
        .stat { padding: 14px 18px; }
        .stat:first-child { border-right: 1px solid #f1f5f9; }
        .stat-lbl {
            font-size: 9.5px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px;
            color: #94a3b8; margin-bottom: 4px;
        }
        .stat-val {
            font-size: 28px; font-weight: 800;
            color: #0f172a; letter-spacing: -1.5px; line-height: 1;
        }
        .stat-unit { font-size: 10px; color: #94a3b8; margin-top: 3px; }

        .ruta-head {
            padding: 12px 18px 8px;
            font-size: 9.5px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .8px; color: #94a3b8;
            display: flex; align-items: center; gap: 7px;
        }
        .ruta-head::after { content:''; flex:1; height:1px; background:#f1f5f9; }

        .pasos { padding: 0 18px 16px; max-height: 220px; overflow-y: auto; }
        .pasos::-webkit-scrollbar { width: 3px; }
        .pasos::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 3px; }

        .paso {
            display: flex; align-items: flex-start; gap: 10px;
            padding: 5px 0; position: relative;
        }
        .paso:not(:last-child)::after {
            content: '';
            position: absolute; left: 11px; top: 24px;
            width: 2px; height: calc(100% - 4px);
            background: repeating-linear-gradient(to bottom,#e2e8f0 0px,#e2e8f0 4px,transparent 4px,transparent 8px);
        }
        .paso-pin {
            width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; font-weight: 800; flex-shrink: 0; z-index: 1;
        }
        .pin-a { background: #16a34a; color: #fff; }
        .pin-b { background: #dc2626; color: #fff; }
        .pin-m { background: #fff; color: #64748b; border: 2px solid #e2e8f0; font-size: 10px; }

        .paso-info { flex: 1; padding-top: 3px; }
        .paso-nombre { font-size: 13px; font-weight: 600; color: #0f172a; }
        .paso-km { font-size: 10.5px; color: #94a3b8; margin-top: 1px; }

        .card-foot {
            padding: 10px 18px 14px;
            border-top: 1px solid #f8fafc;
            display: flex; align-items: center; gap: 7px;
            font-size: 10.5px; color: #cbd5e1; font-weight: 500;
        }
        .foot-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; animation: blink 2s ease-in-out infinite; flex-shrink:0; }
        @keyframes blink { 0%,100%{opacity:1}50%{opacity:.3} }

        /* ── BOTÓN LIMPIAR ── */
        .btn-clear {
            position: fixed; top: 18px; right: 18px; z-index: 200;
            display: none;
            background: #fff; border: none; border-radius: 50%;
            width: 44px; height: 44px;
            box-shadow: 0 2px 8px rgba(0,0,0,.14);
            cursor: pointer; font-size: 18px;
            align-items: center; justify-content: center;
            transition: all .2s;
        }
        .btn-clear.on { display: flex; }
        .btn-clear:hover { background: #fef2f2; transform: scale(1.08); }

        /* ── CHIP INFERIOR ── */
        .route-chip {
            position: fixed; bottom: 28px; left: 50%; z-index: 200;
            transform: translateX(-50%) translateY(80px);
            background: #0f172a; color: #fff;
            padding: 10px 22px; border-radius: 50px;
            font-size: 13px; font-weight: 700;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,.25);
            pointer-events: none;
            transition: transform .4s cubic-bezier(.34,1.56,.64,1), opacity .3s;
            opacity: 0; white-space: nowrap;
        }
        .route-chip.on { transform: translateX(-50%) translateY(0); opacity: 1; }
        .chip-dot { width: 8px; height: 8px; border-radius: 50%; background: #3b82f6; }
        .chip-sep { width: 1px; height: 16px; background: rgba(255,255,255,.18); }
    </style>
</head>
<body>

<div id="map"></div>

<!-- ── TARJETA FLOTANTE ── -->
<div class="card" id="main-card">

    <div class="card-head">
        <div class="head-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        </div>
        <div>
            <div class="head-title">Dijkstra · Puno</div>
            <div class="head-sub">Ruta óptima entre provincias</div>
        </div>
    </div>

    <div class="card-body">
        <div class="field-wrap">
            <div class="field-lbl">
                <div class="marker-dot" style="background:#16a34a;border-color:#16a34a"></div>
                Desde (Origen)
            </div>
            <div class="select-wrap">
                <select id="inicio">
                    {% for c in ciudades %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
                </select>
                <svg class="select-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
        </div>

        <div class="swap-row">
            <div class="swap-line"></div>
            <button class="swap-btn" onclick="swapCiudades()" title="Intercambiar">⇅</button>
            <div class="swap-line"></div>
        </div>

        <div class="field-wrap">
            <div class="field-lbl">
                <div class="marker-dot" style="background:#dc2626;border-color:#dc2626"></div>
                Hasta (Destino)
            </div>
            <div class="select-wrap">
                <select id="fin">
                    {% for c in ciudades %}<option value="{{ c }}" {% if loop.last %}selected{% endif %}>{{ c }}</option>{% endfor %}
                </select>
                <svg class="select-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
        </div>

        <button class="btn-calc" onclick="calcularRuta()">
            <span style="font-size:17px">⚡</span>
            Calcular ruta más corta
        </button>
    </div>

    <div class="state-load" id="st-load">
        <div class="spinner"></div>
        Buscando ruta óptima...
    </div>

    <div class="state-err" id="st-err"></div>

    <div class="res-panel" id="res-panel">
        <div class="stats-row">
            <div class="stat">
                <div class="stat-lbl">Distancia</div>
                <div class="stat-val" id="s-dist">—</div>
                <div class="stat-unit">kilómetros</div>
            </div>
            <div class="stat">
                <div class="stat-lbl">Paradas</div>
                <div class="stat-val" id="s-par">—</div>
                <div class="stat-unit">provincias</div>
            </div>
        </div>

        <div class="ruta-head">Recorrido paso a paso</div>
        <div class="pasos" id="pasos"></div>

        <div class="card-foot">
            <div class="foot-dot"></div>
            Dijkstra · Ruta óptima garantizada
        </div>
    </div>
</div>

<!-- X para limpiar -->
<button class="btn-clear" id="btn-clear" onclick="limpiar()">✕</button>

<!-- Chip inferior -->
<div class="route-chip" id="route-chip">
    <div class="chip-dot"></div>
    <span id="chip-text">—</span>
    <div class="chip-sep"></div>
    <span id="chip-dist" style="color:#93c5fd">—</span>
</div>

<script>
const PROVINCIAS = {
    "Puno":                  { lat: -15.8422, lng: -70.0199 },
    "Azángaro":              { lat: -14.9097, lng: -70.1942 },
    "Carabaya":              { lat: -14.0833, lng: -69.9333 },
    "Chucuito":              { lat: -16.3833, lng: -69.8167 },
    "El Collao":             { lat: -16.4028, lng: -69.2261 },
    "Huancané":              { lat: -15.2058, lng: -69.7547 },
    "Lampa":                 { lat: -15.3631, lng: -70.3697 },
    "Melgar":                { lat: -14.8833, lng: -70.5833 },
    "Moho":                  { lat: -15.3500, lng: -69.4833 },
    "San Antonio de Putina": { lat: -14.9167, lng: -69.8667 },
    "San Román":             { lat: -15.4994, lng: -70.1336 },
    "Sandia":                { lat: -14.2833, lng: -69.4167 },
    "Yunguyo":               { lat: -16.1972, lng: -69.0861 },
};

const ADYACENCIAS = {
    "Puno":                  ["San Román","Chucuito","Huancané","El Collao"],
    "San Román":             ["Puno","Lampa","Azángaro","Huancané"],
    "Lampa":                 ["San Román","Azángaro","Melgar"],
    "Azángaro":              ["San Román","Lampa","Melgar","Huancané","San Antonio de Putina","Carabaya"],
    "Melgar":                ["Lampa","Azángaro","Carabaya"],
    "Carabaya":              ["Azángaro","Melgar","Sandia"],
    "Sandia":                ["Carabaya","San Antonio de Putina"],
    "San Antonio de Putina": ["Azángaro","Sandia","Huancané","Moho"],
    "Huancané":              ["Puno","San Román","Azángaro","San Antonio de Putina","Moho"],
    "Moho":                  ["Huancané","San Antonio de Putina","Yunguyo"],
    "Yunguyo":               ["Moho","El Collao"],
    "El Collao":             ["Puno","Yunguyo","Chucuito"],
    "Chucuito":              ["Puno","El Collao"],
};

let map, elementos = [];

function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: -15.5, lng: -70.0 },
        zoom: 8,
        mapTypeId: "roadmap",
        styles: [
            { elementType: "geometry",           stylers: [{ color: "#f8f9fa" }] },
            { elementType: "labels.text.stroke", stylers: [{ color: "#f5f5f5" }] },
            { elementType: "labels.text.fill",   stylers: [{ color: "#616161" }] },
            { featureType: "road",               elementType: "geometry", stylers: [{ color: "#ffffff" }] },
            { featureType: "road.highway",       elementType: "geometry", stylers: [{ color: "#e8edf2" }] },
            { featureType: "water",              elementType: "geometry", stylers: [{ color: "#bdd9f0" }] },
            { featureType: "landscape",          elementType: "geometry", stylers: [{ color: "#f0f4f8" }] },
            { featureType: "poi",                elementType: "geometry", stylers: [{ color: "#eeeeee" }] },
            { featureType: "administrative",     elementType: "geometry.stroke", stylers: [{ color: "#d0d8e4" }] },
            { featureType: "transit",            stylers: [{ visibility: "off" }] },
        ],
        disableDefaultUI: false,
        zoomControl: true,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
    });

    dibujarGrafo();
    dibujarNodos();
}

function dibujarGrafo() {
    const visto = new Set();
    for (const [c, vecs] of Object.entries(ADYACENCIAS)) {
        for (const v of vecs) {
            const key = [c, v].sort().join("|");
            if (visto.has(key)) continue;
            visto.add(key);
            const ln = new google.maps.Polyline({
                path: [PROVINCIAS[c], PROVINCIAS[v]],
                geodesic: true, strokeColor: "#cbd5e1",
                strokeOpacity: 0.8, strokeWeight: 1.5, map,
            });
            elementos.push({ obj: ln, base: true });
        }
    }
}

function dibujarNodos() {
    for (const [nombre, pos] of Object.entries(PROVINCIAS)) {
        const m = new google.maps.Marker({
            position: pos, map, title: nombre,
            icon: {
                path: google.maps.SymbolPath.CIRCLE,
                fillColor: "#fff", fillOpacity: 1,
                strokeColor: "#94a3b8", strokeWeight: 2, scale: 7,
            },
            label: { text: nombre.slice(0, 2), color: "#475569", fontSize: "8px", fontWeight: "700" },
            zIndex: 3,
        });

        const iw = new google.maps.InfoWindow({
            content: `<div style="font-family:'Inter',sans-serif;padding:10px 14px;min-width:160px">
                <div style="font-size:13px;font-weight:700;color:#0f172a;margin-bottom:10px">${nombre}</div>
                <div style="display:flex;gap:6px">
                    <button onclick="elegir('inicio','${nombre}')"
                        style="flex:1;background:#16a34a;color:#fff;border:none;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit">
                        Origen
                    </button>
                    <button onclick="elegir('fin','${nombre}')"
                        style="flex:1;background:#dc2626;color:#fff;border:none;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit">
                        Destino
                    </button>
                </div>
            </div>`,
        });
        m.addListener("click", () => iw.open(map, m));
        elementos.push({ obj: m, base: true });
    }
}

function elegir(campo, val) { document.getElementById(campo).value = val; }

function swapCiudades() {
    const a = document.getElementById("inicio"), b = document.getElementById("fin");
    const t = a.value; a.value = b.value; b.value = t;
}

function limpiar() {
    elementos.filter(e => !e.base).forEach(e => e.obj.setMap(null));
    elementos = elementos.filter(e => e.base);
    document.getElementById("res-panel").classList.remove("on");
    document.getElementById("st-err").classList.remove("on");
    document.getElementById("btn-clear").classList.remove("on");
    document.getElementById("route-chip").classList.remove("on");
}

function dibujarRuta(ruta) {
    const path = ruta.map(p => ({ lat: p.lat, lng: p.lng }));
    const ln = new google.maps.Polyline({
        path, geodesic: true,
        strokeColor: "#2563eb", strokeOpacity: 1, strokeWeight: 5,
        map, zIndex: 10,
        icons: [
            { icon: { path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW, fillColor:"#2563eb", fillOpacity:1, strokeColor:"#1e3a8a", strokeWeight:1, scale:4 }, offset:"100%" },
            { icon: { path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW, fillColor:"#60a5fa", fillOpacity:.7, strokeColor:"#1e3a8a", strokeWeight:.5, scale:3 }, offset:"50%" },
        ],
    });
    elementos.push({ obj: ln });

    const mA = new google.maps.Marker({
        position: { lat: ruta[0].lat, lng: ruta[0].lng }, map,
        icon: { path: google.maps.SymbolPath.CIRCLE, fillColor:"#16a34a", fillOpacity:1, strokeColor:"#fff", strokeWeight:3, scale:12 },
        label: { text:"A", color:"#fff", fontSize:"11px", fontWeight:"800" },
        zIndex: 25,
    });
    elementos.push({ obj: mA });

    const fin = ruta[ruta.length - 1];
    const mB = new google.maps.Marker({
        position: { lat: fin.lat, lng: fin.lng }, map,
        icon: { path: google.maps.SymbolPath.CIRCLE, fillColor:"#dc2626", fillOpacity:1, strokeColor:"#fff", strokeWeight:3, scale:12 },
        label: { text:"B", color:"#fff", fontSize:"11px", fontWeight:"800" },
        zIndex: 25,
    });
    elementos.push({ obj: mB });

    for (let i = 1; i < ruta.length - 1; i++) {
        const m = new google.maps.Marker({
            position: { lat: ruta[i].lat, lng: ruta[i].lng }, map,
            icon: { path: google.maps.SymbolPath.CIRCLE, fillColor:"#fff", fillOpacity:1, strokeColor:"#2563eb", strokeWeight:2.5, scale:8 },
            label: { text: String(i), color:"#1d4ed8", fontSize:"9px", fontWeight:"800" },
            zIndex: 20,
        });
        elementos.push({ obj: m });
    }

    const bounds = new google.maps.LatLngBounds();
    ruta.forEach(p => bounds.extend({ lat: p.lat, lng: p.lng }));
    map.fitBounds(bounds, { left: 380, top: 30, right: 30, bottom: 80 });
}

function haversineJS(lat1, lon1, lat2, lon2) {
    const R = 6371, p1 = lat1*Math.PI/180, p2 = lat2*Math.PI/180,
          dp = (lat2-lat1)*Math.PI/180, dl = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
    return 2*R*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function mostrarResultados(ruta, distancia) {
    document.getElementById("s-dist").textContent = distancia;
    document.getElementById("s-par").textContent  = ruta.length;

    const cont = document.getElementById("pasos");
    cont.innerHTML = "";
    ruta.forEach((p, i) => {
        const esA = i === 0, esB = i === ruta.length - 1;
        const cls = esA ? "pin-a" : esB ? "pin-b" : "pin-m";
        const lbl = esA ? "A" : esB ? "B" : String(i);
        let sub = "";
        if (!esB) {
            const sig = ruta[i + 1];
            const km = haversineJS(p.lat, p.lng, sig.lat, sig.lng).toFixed(1);
            sub = `<div class="paso-km">→ ${sig.nombre} · ${km} km</div>`;
        }
        const el = document.createElement("div");
        el.className = "paso";
        el.innerHTML = `<div class="paso-pin ${cls}">${lbl}</div><div class="paso-info"><div class="paso-nombre">${p.nombre}</div>${sub}</div>`;
        cont.appendChild(el);
    });

    document.getElementById("res-panel").classList.add("on");
    document.getElementById("btn-clear").classList.add("on");

    document.getElementById("chip-text").textContent = `${ruta[0].nombre} → ${ruta[ruta.length-1].nombre}`;
    document.getElementById("chip-dist").textContent = `${distancia} km`;
    document.getElementById("route-chip").classList.add("on");
}

async function calcularRuta() {
    const inicio = document.getElementById("inicio").value;
    const fin    = document.getElementById("fin").value;

    limpiar();
    document.getElementById("st-err").classList.remove("on");
    document.getElementById("st-load").classList.add("on");

    if (inicio === fin) {
        document.getElementById("st-load").classList.remove("on");
        const e = document.getElementById("st-err");
        e.textContent = "⚠ El origen y destino son la misma provincia.";
        e.classList.add("on");
        return;
    }

    try {
        const res  = await fetch("/ruta", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ inicio, fin }),
        });
        const data = await res.json();
        document.getElementById("st-load").classList.remove("on");

        if (!data.encontrado || !data.ruta.length) {
            const e = document.getElementById("st-err");
            e.textContent = "⚠ No se encontró ruta entre esas provincias.";
            e.classList.add("on");
            return;
        }

        dibujarRuta(data.ruta);
        mostrarResultados(data.ruta, data.distancia);

    } catch {
        document.getElementById("st-load").classList.remove("on");
        const e = document.getElementById("st-err");
        e.textContent = "⚠ Error al conectar con el servidor.";
        e.classList.add("on");
    }
}
</script>
